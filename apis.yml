description: >-
  Axsome Therapeutics (NASDAQ: AXSM) is a biopharmaceutical company developing
  and delivering novel therapies for the management of central nervous system
  (CNS) disorders. Headquartered at One World Trade Center, New York, Axsome
  markets three FDA-approved products — Auvelity (dextromethorphan-bupropion)
  for major depressive disorder, Sunosi (solriamfetol) for excessive daytime
  sleepiness in narcolepsy and obstructive sleep apnea, and Symbravo
  (meloxicam-rizatriptan) for the acute treatment of migraine — and is
  advancing a pipeline including AXS-05 for Alzheimer's disease agitation and
  smoking cessation, AXS-12 (reboxetine) for narcolepsy, and AXS-14
  (esreboxetine) for fibromyalgia. Axsome operates a corporate website and
  product / HCP microsites but does not expose a public developer API surface;
  this profile catalogs corporate, product, regulatory, and investor
  touchpoints rather than programmatic interfaces.
