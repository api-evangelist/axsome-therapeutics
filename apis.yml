  - type: ProductsList
    data:
      - name: Auvelity
        genericName: Dextromethorphan and Bupropion
        indication: Major Depressive Disorder (MDD) in adults
        status: FDA Approved
        productSite: https://www.auvelity.com
        hcpSite: https://www.auvelityhcp.com
        notes: Approved by the FDA in August 2022; oral NMDA receptor antagonist and sigma-1 receptor agonist combined with a CYP2D6 inhibitor.
      - name: Sunosi
        genericName: Solriamfetol
        indication: Excessive daytime sleepiness associated with narcolepsy or obstructive sleep apnea (OSA) in adults
        status: FDA Approved
        productSite: https://www.sunosi.com
        hcpSite: https://www.sunosihcp.com
        notes: Dopamine and norepinephrine reuptake inhibitor (DNRI); also approved in Canada and the European Union (EMA SmPC).
      - name: Symbravo
        genericName: Meloxicam and Rizatriptan
        indication: Acute treatment of migraine with or without aura in adults
        status: FDA Approved
        productSite: https://www.symbravo.com
        hcpSite: https://www.symbravohcp.com
        notes: FDA approved January 2025; multi-mechanistic, oral fixed-dose combination of an NSAID (meloxicam) and a 5-HT1B/1D receptor agonist (rizatriptan).
  - type: PipelineList
    data:
      - name: AXS-05
        components: Dextromethorphan and Bupropion
        indication: Agitation associated with dementia due to Alzheimer's disease; smoking cessation
        status: Approved for Alzheimer's disease agitation; in development for additional indications
        mechanism: NMDA receptor antagonist and sigma-1 receptor agonist (dextromethorphan); CYP2D6 inhibitor and DNRI (bupropion)
      - name: AXS-12
        genericName: Reboxetine
        indication: Narcolepsy (cataplexy and excessive daytime sleepiness)
        status: Investigational; FDA Orphan Drug Designation for narcolepsy
        mechanism: Selective norepinephrine reuptake inhibitor (NRI)
      - name: AXS-14
        genericName: Esreboxetine
        indication: Fibromyalgia
        status: Investigational
        mechanism: Selective norepinephrine reuptake inhibitor (NRI), single enantiomer of reboxetine
