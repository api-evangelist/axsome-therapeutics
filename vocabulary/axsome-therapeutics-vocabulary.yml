vocabulary: "1.0.0"

info:
  provider: Axsome Therapeutics
  description: >-
    Domain vocabulary for Axsome Therapeutics, a biopharmaceutical company
    focused on the central nervous system (CNS). This vocabulary catalogs
    marketed products, pipeline candidates, therapeutic areas, mechanisms of
    action, and corporate / regulatory touchpoints. Axsome does not currently
    expose a public developer API surface, so the vocabulary is organized
    around the company's clinical, commercial, and disclosure footprint rather
    than around HTTP resources.
  created: "2026-05-23"
  modified: "2026-05-23"

