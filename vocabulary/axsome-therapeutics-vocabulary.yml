publicDeveloperSurface:
  status: none
  notes: >-
    Axsome Therapeutics does not publish a developer portal, public OpenAPI
    specification, SDKs, CLI, webhooks API, or partner API at this time. The
    corporate site is a WordPress-backed marketing presence with a standard
    RSS feed; HCP and patient microsites for Auvelity, Sunosi, and Symbravo
    publish prescribing and educational content but not programmatic
    interfaces. Programmatic access to Axsome data is therefore limited to
    third-party regulatory data sources (FDA Drugs@FDA, EMA, Health Canada,
    EDGAR, NASDAQ market data, ClinicalTrials.gov).
