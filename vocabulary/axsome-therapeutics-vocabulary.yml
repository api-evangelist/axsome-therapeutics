  contact: https://www.axsome.com/contact-us/

products:
  - name: Auvelity
    genericName: Dextromethorphan and Bupropion
    indication: Major Depressive Disorder (MDD) in adults
    therapeuticArea: Depression
    mechanism:
      - NMDA receptor antagonist
      - Sigma-1 receptor agonist
      - CYP2D6 inhibitor
    regulatoryStatus: FDA Approved
    productSite: https://www.auvelity.com
    hcpSite: https://www.auvelityhcp.com
  - name: Sunosi
    genericName: Solriamfetol
    indication: Excessive daytime sleepiness associated with narcolepsy or obstructive sleep apnea (OSA) in adults
    therapeuticArea: Sleep-Wake Disorders
    mechanism:
      - Dopamine-norepinephrine reuptake inhibitor (DNRI)
    regulatoryStatus: FDA Approved; EMA Authorized; Health Canada Approved
    productSite: https://www.sunosi.com
    hcpSite: https://www.sunosihcp.com
  - name: Symbravo
    genericName: Meloxicam and Rizatriptan
    indication: Acute treatment of migraine with or without aura in adults
    therapeuticArea: Migraine
    mechanism:
      - NSAID (COX-2 selective; meloxicam)
      - 5-HT1B/1D receptor agonist (rizatriptan)
    regulatoryStatus: FDA Approved
    productSite: https://www.symbravo.com
    hcpSite: https://www.symbravohcp.com

pipeline:
  - code: AXS-05
    components: Dextromethorphan and Bupropion
    indications:
      - Agitation associated with dementia due to Alzheimer's disease
      - Smoking cessation
    mechanism:
      - NMDA receptor antagonist
      - Sigma-1 receptor agonist
      - DNRI / CYP2D6 inhibitor
    status: Approved for Alzheimer's disease agitation; in development for additional indications
  - code: AXS-12
    genericName: Reboxetine
    indications:
      - Narcolepsy
    mechanism:
      - Selective norepinephrine reuptake inhibitor (NRI)
    designations:
      - FDA Orphan Drug Designation (narcolepsy)
    status: Investigational
  - code: AXS-14
    genericName: Esreboxetine
    indications:
      - Fibromyalgia
    mechanism:
      - Selective norepinephrine reuptake inhibitor (NRI), single enantiomer
    status: Investigational

