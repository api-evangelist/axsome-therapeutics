mechanismsOfAction:
  - id: nmda-antagonist
    label: NMDA Receptor Antagonist
    description: Antagonism of the N-methyl-D-aspartate glutamate receptor; implicated in rapid-acting antidepressant and neuroprotective effects.
  - id: sigma1-agonist
    label: Sigma-1 Receptor Agonist
    description: Activation of sigma-1 chaperone receptor, modulating neuroplasticity and intracellular signaling.
  - id: dnri
    label: Dopamine-Norepinephrine Reuptake Inhibitor (DNRI)
    description: Inhibition of dopamine and norepinephrine transporters, promoting wakefulness and mood effects.
  - id: nri
    label: Norepinephrine Reuptake Inhibitor (NRI)
    description: Selective inhibition of the norepinephrine transporter.
  - id: cyp2d6-inhibitor
    label: CYP2D6 Inhibitor
    description: Inhibits hepatic CYP2D6 metabolism to extend exposure of a co-administered substrate.
  - id: cox-nsaid
    label: NSAID (COX-2 Selective)
    description: Non-steroidal anti-inflammatory drug with COX-2 selective inhibition.
  - id: 5ht1b-1d-agonist
    label: 5-HT1B/1D Receptor Agonist
    description: Triptan-class serotonergic agonist used in acute migraine therapy.
  - id: taar1-agonist
    label: Trace Amine-Associated Receptor 1 (TAAR1) Agonist
    description: Modulation of TAAR1 implicated in monoaminergic neurotransmission.

